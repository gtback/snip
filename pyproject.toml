[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snip"
dynamic = ["version"]
description = "Run shell commands in a clean bash and copy a shareable transcript"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
snip = "snip.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "src/snip/__init__.py"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
